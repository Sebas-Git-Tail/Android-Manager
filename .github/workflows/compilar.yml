# Compila el APK (sin firmar y sin los binarios de Preparar-binarios.sh, que no están en git) en cada push,
# para enterarse enseguida si algo no compila, y corre las pruebas de tests/ con el Qt de escritorio. Las
# pruebas del código compartido están en comun-qt.
name: Compilar

on:
  push:
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Desde Qt 6.7, Qt para Android está bajo el host «all_os»; autodesktop baja también el Qt de
      # escritorio de la misma versión (hace falta para compilar)
      - name: Qt para Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.0'
          host: all_os
          target: android
          arch: android_arm64_v8a
          autodesktop: true
          cache: true
      # Java 17 explícito: las máquinas de GitHub ya no traen JAVA_HOME_17_X64 y con su Java por defecto
      # (25) el Gradle de Qt falla con «Unsupported class file major version 69»
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pruebas (tests/, Qt de escritorio)
        run: QT_ESCRITORIO="$(dirname "$QT_ROOT_DIR")/gcc_64" tests/correr.sh
      - name: Compilar el APK
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -B build -S gui -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$(dirname "$QT_ROOT_DIR")/gcc_64" \
            -DANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" -DANDROID_NDK_ROOT="$ANDROID_NDK_LATEST_HOME" \
            -DQT_ANDROID_ABIS=arm64-v8a
          cmake --build build --target apk
      # Propiedades que no existen, imports rotos, etc. (los avisos falsos conocidos están en gui/qmllint-conocidos.txt)
      - name: Revisar los QML (qmllint)
        run: QMLLINT="$(dirname "$QT_ROOT_DIR")/gcc_64/bin/qmllint" ./Revisar-qml.sh build
